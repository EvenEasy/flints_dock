[workspace]
resolver = "3"
members = ["crates/core", "apps/cli", "apps/app/src-tauri"]
default-members = ["apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
dock-flints-core = { path = "crates/core" }
anyhow = "1.0.104"
clap = { version = "4.0", features = ["derive"] }
mpl-token-metadata = "5.1.1"
solana-account-decoder = "4.3.0"
# HTTP RPC only: no TPU, QUIC, pubsub, connection cache or validator networking.
solana-rpc-client = { version = "=4.3.0", default-features = false }
solana-rpc-client-api = "=4.3.0"
solana-commitment-config = "3.1.1"
solana-pubkey = "4.4.0"
solana-pubkey-v2 = {
    package = "solana-pubkey",
    version = "=2.4.0"
}
spl-token-2022-interface = "3.1.1"
spl-token-interface = "3.0.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
mpl-core = "0.12.1"
mpl-bubblegum = "4.0.0"
solana-keccak-hasher = "3.1.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
solana-account = "4.7.0"

solana-keypair = "=3.1.2"
solana-signer = "=3.0.1"
solana-transaction = { version = "=4.3.0", features = ["wincode", "serde"] }
solana-message = "=4.6.0"
solana-instruction = "=3.5.1"
solana-hash = "=4.7.0"
bincode = "1.3.3"
thiserror = "2.0.20"
base64 = "0.22"
async-trait = "0.1"
borsh = "0.10.4"
tauri = { version = "2", default-features = false, features = ["wry"] }
tauri-build = { version = "2", default-features = false }
