[package]
name = "flints_station"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.0", features = ["derive"] }
mpl-token-metadata = "5.1.1"
solana-account-decoder = "4.3.0"
solana-client = "4.3.0"
solana-commitment-config = "3.1.1"
solana-pubkey = "4.4.0"
solana-sdk = "5.0.0"
solana-pubkey-v2 = {
    package = "solana-pubkey",
    version = "=2.4.0"
}
spl-token-2022-interface = "3.1.1"
spl-token-interface = "3.0.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
mpl-core = "0.12.1"
